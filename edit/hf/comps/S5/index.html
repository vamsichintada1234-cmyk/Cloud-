<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<script src="engine.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  .fadeband { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to bottom, #000 0px, #000 900px, transparent 1060px);
              mask-image: linear-gradient(to bottom, #000 0px, #000 900px, transparent 1060px); }
  /* split layout: content between y 40 and 900; main element bottom edge at 885 */
  #brand { left: 140px; top: 225px; width: 800px; height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  #brand .mark { width: 190px; height: 190px; border-radius: 52px; background: var(--terra); display: grid; place-items: center; }
  #brand .word { font-size: 150px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  #brand .word i { font-style: normal; color: var(--terra-text); }
  #chip { left: 330px; top: 765px; width: 420px; height: 120px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 52px; font-weight: 700; }
  #chip b { color: var(--terra-text); }
</style>
</head>
<body>
<div id="root" data-composition-id="S5" data-start="0" data-duration="1.50" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="1.50" data-track-index="0" style="position:absolute;inset:0">
    <div class="bg"></div>
    <div class="fadeband"><div class="world" id="world">
      <div class="el elev r-block" id="brand">
        <div class="mark"><svg width="120" height="120" viewBox="0 0 96 96" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M34 14 L14 26 L22 44 L30 40 L30 82 L66 82 L66 40 L74 44 L82 26 L62 14 C58 22 38 22 34 14 Z"/></svg></div>
        <div class="word">Fabro<i>.</i></div>
      </div>
      <div class="el elev r-block" id="chip">MOQ <b>?</b></div>
    </div></div>
  </div>
</div>
<script>
  const { track, aim, camSpeed, sigmaFor, bake, blurCss, E } = HF;
  const D = 1.5, tl = gsap.timeline({ paused: true });
  gsap.set("#world", { transformOrigin: "0 0" });
  const cam = track([[0, aim(540, 485, 540, 485, 1)], [D, aim(540, 485, 540, 485, 1.03), "sine.inOut"]]);   // gentle drift
  const CHIP = 0.30;   // "MOQ ?" block arrives (thump at landing = 0.30 + 0.32)
  bake(tl, D, t => {
    const c = cam(t), q = Math.max(0, Math.min(1, (t - CHIP) / 0.32));
    return { "#world": { x: c[0], y: c[1], scale: c[2], filter: blurCss(sigmaFor(camSpeed(cam, t, 540, 485))) },
             "#chip": { y: 140 * (1 - E["power3.out"](q)), opacity: t < CHIP ? 0 : Math.min(1, q * 3) } };
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["S5"] = tl;
  tl.seek(0);
</script>
</body>
</html>

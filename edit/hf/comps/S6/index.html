<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<script src="engine.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  /* frame 0: the order card (rest) ; whip -> Fabro wordmark block, bottom edge y = 1215 */
  #recap { left: 190px; top: 560px; width: 700px; height: 655px; padding: 56px; }
  #recap .bars { position: relative; margin-top: 40px; height: 300px; border-radius: 40px; background: var(--band); }
  #recap .bar { position: absolute; bottom: 0; width: 96px; border-radius: 22px 22px 0 0; background: var(--terra); }
  #recap .ok { margin-top: 36px; height: 100px; border-radius: 50px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 34px; font-weight: 700; }
  #brand { left: 1590px; top: 515px; width: 900px; height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  #brand .mark { width: 230px; height: 230px; border-radius: 62px; background: var(--terra); display: grid; place-items: center; }
  #brand .word { font-size: 190px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  #brand .word i { font-style: normal; color: var(--terra-text); }
</style>
</head>
<body>
<div id="root" data-composition-id="S6" data-start="0" data-duration="5.70" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="5.70" data-track-index="0" style="position:absolute;inset:0">
    <div class="bg"></div>
    <div class="world" id="world">
      <div class="el elev r-doc" id="recap">
        <div class="t-sub">MOQ</div>
        <div class="bars"><div class="bar" style="left:44px;height:200px"></div><div class="bar" style="left:184px;height:216px"></div><div class="bar" style="left:324px;height:208px"></div><div class="bar" style="left:464px;height:194px"></div></div>
        <div class="ok"><svg width="44" height="44" viewBox="0 0 58 58"><path d="M12 30 L24 42 L47 17" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>Ready to produce</div>
      </div>
      <div class="el elev r-block" id="brand">
        <div class="mark"><svg width="150" height="150" viewBox="0 0 96 96" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M34 14 L14 26 L22 44 L30 40 L30 82 L66 82 L66 40 L74 44 L82 26 L62 14 C58 22 38 22 34 14 Z"/></svg></div>
        <div class="word">Fabro<i>.</i></div>
      </div>
    </div>
  </div>
</div>
<script>
  const { track, aim, camSpeed, sigmaFor, bake, blurCss } = HF;
  const D = 5.7, tl = gsap.timeline({ paused: true });
  gsap.set("#world", { transformOrigin: "0 0" });
  // whip: rest until 0.30, exit 0.45 s power3.in, arrival 0.60 s power3.out (mid of move = 0.825 s), then gentle drift
  const A = aim(540, 888, 540, 888, 1), MID = aim(1290, 888, 540, 888, 1), B = aim(2040, 865, 540, 865, 1);
  const cam = track([[0.30, A], [0.75, MID, "power3.in"], [1.35, B, "power3.out"], [D, aim(2040, 865, 540, 865, 1.035), "sine.inOut"]]);
  bake(tl, D, t => {
    const c = cam(t), sig = sigmaFor(camSpeed(cam, t, 540, 888));
    const away = Math.max(0, Math.min(1, (t - 0.3) / 0.45));
    return { "#world": { x: c[0], y: c[1], scale: c[2], filter: blurCss(sig) },
             "#recap": { filter: blurCss(14 * away), opacity: 1 - 0.3 * away } };
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["S6"] = tl;
  tl.seek(0);
</script>
</body>
</html>

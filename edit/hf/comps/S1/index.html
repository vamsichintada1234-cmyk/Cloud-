<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<script src="engine.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  /* split layout: graphic environment fades out from y=900 over a 160 px band */
  .fadeband { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to bottom, #000 0px, #000 900px, transparent 1060px);
              mask-image: linear-gradient(to bottom, #000 0px, #000 900px, transparent 1060px); }
  #logo { left: 140px; top: 620px; width: 800px; height: 260px; display: flex; align-items: center; justify-content: center; gap: 44px; }
  #logo .mark { width: 150px; height: 150px; border-radius: 40px; background: var(--terra); display: grid; place-items: center; }
  #logo .word { font-size: 150px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; margin-top: 14px; }
  #logo .word i { font-style: normal; color: var(--terra-text); }
  #moq { left: 1320px; top: 80px; width: 840px; height: 800px; padding: 64px 60px 60px; }
  #moq .head { display: flex; align-items: baseline; justify-content: space-between; }
  #moq .lbl { color: var(--terra-text); margin-top: 6px; }
  #moq .pill { font-size: 30px; font-weight: 700; color: var(--terra-text); background: var(--band); padding: 10px 26px; border-radius: 40px; }
  #moq .band { position: absolute; left: 60px; right: 60px; bottom: 60px; height: 440px; border-radius: 40px; background: var(--band); overflow: hidden; }
  .box { position: absolute; left: 150px; width: 420px; height: 58px; border-radius: 14px; background: var(--terra); }
  .box::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 46px; margin-left: -23px; background: rgba(255,255,255,0.35); }
  #stamp { left: 500px; top: 268px; width: 250px; height: 112px; border: 8px solid var(--red); border-radius: 28px; color: var(--red);
           font-size: 64px; font-weight: 700; display: grid; place-items: center; letter-spacing: 0.02em; background: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div id="root" data-composition-id="S1" data-start="0" data-duration="3.15" data-width="1080" data-height="1920">
  <div class="clip" data-start="0" data-duration="3.15" data-track-index="0" style="position:absolute;inset:0">
    <div class="bg"></div>
    <div class="fadeband">
      <div class="world" id="world">
        <div class="el elev r-block" id="logo">
          <div class="mark"><svg width="96" height="96" viewBox="0 0 96 96" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
            <path d="M34 14 L14 26 L22 44 L30 40 L30 82 L66 82 L66 40 L74 44 L82 26 L62 14 C58 22 38 22 34 14 Z"/></svg></div>
          <div class="word">Fabro<i>.</i></div>
        </div>
        <div class="el elev r-block" id="moq">
          <div class="head"><div class="t-title">MOQ</div><div class="pill">Order form</div></div>
          <div class="t-body lbl">Minimum order quantity</div>
          <div class="band" id="band">
            <div class="box" id="b0"></div><div class="box" id="b1"></div><div class="box" id="b2"></div>
            <div class="box" id="b3"></div><div class="box" id="b4"></div><div class="box" id="b5"></div>
          </div>
          <div class="el" id="stamp">HIGH?</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const { track, aim, camSpeed, sigmaFor, bake, blurCss } = HF;
  const D = 3.15, tl = gsap.timeline({ paused: true });
  gsap.set("#world", { transformOrigin: "0 0" });
  // Camera: drift on the logo (scale +0.03), 0.5 s power3.inOut move to the MOQ card starting 0.25 s before "MOQ" (1.38),
  // then a gentle drift on the MOQ card. Frame 0 = identity, at rest.
  const restLogo = s => aim(540, 750, 540, 750, s);
  const restMoq = s => aim(1740, 480, 540, 480, s);
  const cam = track([[0, restLogo(1)], [1.13, restLogo(1.03), "sine.inOut"], [1.63, restMoq(1), "power3.inOut"], [D, restMoq(1.025), "sine.inOut"]]);
  const moveP = track([[1.13, 0], [1.63, 1, "power3.inOut"]]);
  const boxT0 = 1.86, boxDt = 0.12;               // cartons stack up on "ekkuva" (1.92)
  const stampT = 2.62;
  bake(tl, D, t => {
    const c = cam(t), sig = sigmaFor(camSpeed(cam, t, 540, 480));
    const st = { "#world": { x: c[0], y: c[1], scale: c[2], filter: blurCss(sig) } };
    // depth of field while the camera passes: logo card up to 14 px blur, -30% emphasis
    const m = moveP(t), dof = Math.sin(Math.PI * Math.min(1, m * 1.0)) * (m < 1 ? 1 : 0);
    st["#logo"] = { filter: blurCss(14 * Math.min(1, m * 2)), opacity: 1 - 0.3 * Math.min(1, m * 2) };
    st["#moq"] = { filter: blurCss(14 * Math.max(0, 1 - m * 2.2) * (m > 0 ? 1 : 0)), opacity: m > 0 ? 0.7 + 0.3 * Math.min(1, m * 2.2) : 1 };
    for (let i = 0; i < 6; i++) {
      const p = Math.max(0, Math.min(1, (t - (boxT0 + i * boxDt)) / 0.16));
      const e = HF.E["power2.out"](p);
      st["#b" + i] = { y: 440 - 40 - (i + 1) * 64 + (-90 * (1 - e)), x: (i % 2 ? 14 : -14), opacity: p > 0 ? Math.min(1, p * 3) : 0 };
    }
    const sp = Math.max(0, Math.min(1, (t - stampT) / 0.14)), se = HF.E["power3.out"](sp);
    st["#stamp"] = { scale: 1.5 - 0.5 * se, rotation: -10, opacity: sp > 0 ? Math.min(1, sp * 2) : 0 };
    return st;
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["S1"] = tl;
  tl.seek(0);
</script>
</body>
</html>

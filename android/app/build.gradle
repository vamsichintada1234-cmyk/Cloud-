plugins {
    id "com.android.application"
}

def thirdParty = rootProject.file("third_party")
def webApp = rootProject.file("../app")
def genAssets = layout.buildDirectory.dir("generated/nodeapp-assets")
def genJni = layout.buildDirectory.dir("generated/refcut-jniLibs")
// CPU types to include; build a smaller single-ABI APK with -Pabis=arm64-v8a
def abis = (project.findProperty("abis") ?: "arm64-v8a,armeabi-v7a").split(",").collect { it.trim() }

android {
    namespace "com.refcut.app"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.refcut.app"
        minSdk 24
        // 28: lets the app run the ffmpeg program it unpacks into its own storage (newer targets forbid
        // executing app-data files). Fine for a sideloaded APK; a Play Store build would need another route.
        targetSdk 28
        versionCode 4
        versionName "1.3"
        // 64-bit phones and 32-bit Android (common on budget / Android Go phones)
        ndk { abiFilters(*abis) }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DNODE_MOBILE_DIR=${thirdParty}/nodejs-mobile"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs directly; use your own keystore for the Play Store
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += genAssets
            jniLibs.srcDirs += genJni
        }
    }

    packaging {
        // keep the APK small: native libs compressed and extracted on install
        jniLibs { useLegacyPackaging true }
        jniLibs.pickFirsts += ["**/libnode.so", "**/libc++_shared.so"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The RefCut web app (server + UI) is bundled as assets and run by Node on the phone.
def copyNodeApp = tasks.register("copyNodeApp", Sync) {
    from(webApp) {
        include "server.js", "lib/**", "public/**"
    }
    into genAssets.map { it.dir("nodeapp") }
}

// libnode.so per ABI, and ffmpeg per ABI as an asset (unpacked and made executable on first launch)
def genBins = layout.buildDirectory.dir("generated/ffmpeg-assets")
def copyNativeBins = tasks.register("copyNativeBins", Sync) {
    abis.each { abi -> from("${thirdParty}/nodejs-mobile/bin/${abi}/libnode.so") { into abi } }
    into genJni
}
def copyFfmpeg = tasks.register("copyFfmpeg", Sync) {
    abis.each { abi -> from("${thirdParty}/ffmpeg/${abi}/ffmpeg") { into "ffmpeg/${abi}" } }
    into genBins
    doFirst {
        abis.each { abi ->
            if (!file("${thirdParty}/ffmpeg/${abi}/ffmpeg").exists()) throw new GradleException("Run android/fetch-binaries.sh first")
        }
    }
}
android.sourceSets.main.assets.srcDirs += genBins

tasks.named("preBuild") { dependsOn copyNodeApp, copyNativeBins, copyFfmpeg }

plugins {
    id "com.android.application"
}

def thirdParty = rootProject.file("third_party")
def webApp = rootProject.file("../app")
def genAssets = layout.buildDirectory.dir("generated/nodeapp-assets")
def genJni = layout.buildDirectory.dir("generated/refcut-jniLibs")
// CPU types to include, e.g. -Pabis=arm64-v8a,x86_64 (FFmpegKit ships arm64-v8a and x86_64 only)
def abis = (project.findProperty("abis") ?: "arm64-v8a").split(",").collect { it.trim() }

android {
    namespace "com.refcut.app"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.refcut.app"
        minSdk 24
        // 34, not 35: Android 15 forces edge-to-edge drawing on 35, which would put the UI under the status bar
        targetSdk 34
        versionCode 5
        versionName "1.4"
        ndk { abiFilters(*abis) }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DNODE_MOBILE_DIR=${thirdParty}/nodejs-mobile"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs directly; use your own keystore for the Play Store
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += genAssets
            jniLibs.srcDirs += genJni
        }
    }

    packaging {
        // keep the APK small: native libs compressed and extracted on install
        jniLibs { useLegacyPackaging true }
        jniLibs.pickFirsts += ["**/libnode.so", "**/libc++_shared.so"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ffmpeg built for Android (community-maintained continuation of FFmpegKit, GPL-3.0, includes x264)
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:7.1.7"
}

// The RefCut web app (server + UI) is bundled as assets and run by Node on the phone.
def copyNodeApp = tasks.register("copyNodeApp", Sync) {
    from(webApp) {
        include "server.js", "lib/**", "public/**"
    }
    into genAssets.map { it.dir("nodeapp") }
}

// libnode.so per ABI
def copyNativeBins = tasks.register("copyNativeBins", Sync) {
    abis.each { abi -> from("${thirdParty}/nodejs-mobile/bin/${abi}/libnode.so") { into abi } }
    into genJni
    doFirst {
        if (!file("${thirdParty}/nodejs-mobile/bin/arm64-v8a/libnode.so").exists()) throw new GradleException("Run android/fetch-binaries.sh first")
    }
}

tasks.named("preBuild") { dependsOn copyNodeApp, copyNativeBins }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Shadow Hunter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f16;
        color: #e8ecf4;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0 0 auto 0;
        height: 64px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 16px;
        pointer-events: none;
      }
      #center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      #level {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.12em;
        padding: 3px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }
      #targets {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        max-width: 60vw;
        font-size: 13px;
        font-weight: 800;
      }
      .foe {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e8a33d;
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
        position: relative;
      }
      .foe.down {
        background: #4a4f5c;
      }
      .foe.down::after {
        content: "";
        position: absolute;
        inset: 5px -1px;
        background: #e3263b;
        transform: rotate(-45deg);
        border-radius: 2px;
      }
      .gem {
        justify-self: end;
        color: #43e3ff;
        font-size: 18px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 18, 0.72);
      }
      #overlay.show {
        display: flex;
      }
      .card {
        text-align: center;
        padding: 28px 32px;
        border-radius: 14px;
        background: #1f2430;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        max-width: calc(100vw - 64px);
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .card p {
        margin: 0 0 20px;
        color: #a9b2c6;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 12px 28px;
        border: 0;
        border-radius: 10px;
        background: #d8283a;
        color: #fff;
        cursor: pointer;
      }
      #bench {
        position: fixed;
        right: 12px;
        bottom: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        display: none;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        text-align: center;
        font-size: 13px;
        color: #8d97ad;
        pointer-events: none;
        transition: opacity 0.6s;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <span></span>
      <div id="center">
        <span id="level">LEVEL 1</span>
        <div id="targets"></div>
      </div>
      <span class="gem" id="gems">◆ 0</span>
    </div>
    <div id="hint">Tap or click to move · WASD / arrows also work · Reach a guard to take them out · Stay out of the cones</div>
    <pre id="bench"></pre>
    <div id="overlay">
      <div class="card">
        <h1 id="ovTitle"></h1>
        <p id="ovText"></p>
        <button id="ovBtn"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

plugins {
    id "com.android.application"
}

// Release signing comes from android/keystore.properties (never committed):
//   storeFile=/path/to/upload-keystore.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
// Without it, release builds fall back to the debug key, which is fine for sideloading but not for Google Play.
def keystoreFile = rootProject.file("keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace "com.shadowhunter.game"
    compileSdk 36

    defaultConfig {
        applicationId "com.vamsichintada.shadowhunter"
        minSdk 26
        // Google Play requires new apps and updates to target Android 16 (API 36) from August 31, 2026.
        targetSdk 36
        versionCode 5
        versionName "1.0.0"
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig keystoreFile.exists() ? signingConfigs.upload : signingConfigs.debug
        }
    }

    sourceSets {
        // The game is built by Vite into ../dist (run `npm run build` first); ship it as the app's assets.
        main.assets.srcDirs += ["../../dist"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

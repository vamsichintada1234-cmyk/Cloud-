plugins {
    id "com.android.application"
}

android {
    namespace "com.shadowhunter.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.shadowhunter.game"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Signed with the debug key so the APK can be sideloaded; use a real keystore for the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        // The game is built by Vite into ../dist (run `npm run build` first); ship it as the app's assets.
        main.assets.srcDirs += ["../../dist"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

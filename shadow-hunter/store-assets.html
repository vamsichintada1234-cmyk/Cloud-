<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shadow Hunter store assets</title>
    <style>
      body {
        margin: 0;
        background: #111;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /* Feature graphic: exactly 1024x500. */
      #feature {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: #0b0e14;
      }
      #feature .stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #feature .shade {
        position: absolute;
        z-index: 1;
        inset: 0;
        background: linear-gradient(90deg, rgba(5, 6, 10, 0.92) 0%, rgba(5, 6, 10, 0.75) 34%, rgba(5, 6, 10, 0) 62%);
      }
      #feature .title {
        position: absolute;
        z-index: 2;
        left: 56px;
        top: 50%;
        transform: translateY(-50%);
        color: #fff;
      }
      #feature h1 {
        margin: 0;
        font-size: 92px;
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: 0.03em;
        text-shadow: 0 6px 0 #6b0f1a, 0 12px 30px rgba(0, 0, 0, 0.8);
      }
      #feature h1 span {
        color: #e3263b;
        text-shadow: 0 6px 0 #3d070e, 0 12px 30px rgba(0, 0, 0, 0.8);
      }
      #feature p {
        margin: 22px 0 0;
        font-size: 24px;
        font-weight: 700;
        color: #c9d1e2;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="feature">
      <div class="shade"></div>
      <div class="title">
        <h1>SHADOW<br /><span>HUNTER</span></h1>
        <p>Sneak. Strike. Vanish.</p>
      </div>
    </div>
    <script type="module" src="/src/store-assets.ts"></script>
  </body>
</html>
